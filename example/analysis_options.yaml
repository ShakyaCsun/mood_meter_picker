include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint: ^3.1.8

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

formatter:
  trailing_commas: automate

linter:
  rules:
    public_member_api_docs: false
    # unnecessary_breaks: true
