name: mood_meter_picker
description: A Flutter package project that tries to implement Mood Meter Picker from https://moodmeterapp.com/science/.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  bloc: ^9.2.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_portal: ^1.1.4
  freezed_annotation: ^3.1.0

dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.0-dev.3
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
